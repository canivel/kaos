[project]
name = "kaos-plugin-example"
version = "0.1.0"
description = "Template for a third-party KAOS plugin: one model provider + one MCP tool, discovered via the kaos.plugins entry point."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["kaos-harness>=2.0"]

# This is the whole integration contract. KAOS calls `register(registry)`
# at startup; nothing in kaos core knows this package exists.
[project.entry-points."kaos.plugins"]
example = "kaos_plugin_example:register"

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaos_plugin_example"]
