[project]
name = "kaos-plugin-codex"
version = "0.1.0"
description = "KAOS model provider for OpenAI Codex CLI (`codex exec`) — ChatGPT-subscription auth, no API key."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["kaos-harness[router]>=2.1"]

[project.entry-points."kaos.plugins"]
codex = "kaos_plugin_codex:register"

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaos_plugin_codex"]
