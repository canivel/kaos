<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="Segoe UI,system-ui,sans-serif">
  <defs>
    <marker id="fr-arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7" fill="none" stroke="#6b6b80" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="430" rx="14" fill="#12121a" stroke="#ffffff14"/>
  <text x="40" y="42" fill="#e4e4ef" font-size="19" font-weight="700">One SQLite file — the flight recorder</text>
  <text x="40" y="64" fill="#9494a8" font-size="12.5">Audit isn’t a telemetry exporter you bolt on; it’s the storage engine itself.</text>

  <!-- agents feeding in -->
  <g font-size="12">
    <rect x="40" y="120" width="120" height="40" rx="8" fill="#1a1a26" stroke="#ffffff22"/>
    <text x="100" y="145" fill="#e4e4ef" text-anchor="middle">agent “alice”</text>
    <rect x="40" y="176" width="120" height="40" rx="8" fill="#1a1a26" stroke="#ffffff22"/>
    <text x="100" y="201" fill="#e4e4ef" text-anchor="middle">agent “bob”</text>
    <rect x="40" y="232" width="120" height="40" rx="8" fill="#1a1a26" stroke="#ffffff22"/>
    <text x="100" y="257" fill="#e4e4ef" text-anchor="middle">agent “…”</text>
  </g>
  <g stroke="#6b6b80" stroke-width="1.4" marker-end="url(#fr-arr)">
    <line x1="160" y1="140" x2="212" y2="168"/>
    <line x1="160" y1="196" x2="212" y2="196"/>
    <line x1="160" y1="252" x2="212" y2="224"/>
  </g>
  <text x="100" y="300" fill="#6b6b80" font-size="11" text-anchor="middle">every tool call, file write,</text>
  <text x="100" y="316" fill="#6b6b80" font-size="11" text-anchor="middle">state change, decision</text>

  <!-- the file -->
  <rect x="216" y="96" width="420" height="280" rx="14" fill="#0d0d14" stroke="#6c5ce7" stroke-width="2"/>
  <text x="426" y="122" fill="#a29bfe" font-size="13" font-weight="700" text-anchor="middle" font-family="Consolas,monospace">project.db  ·  schema v9  ·  26 tables</text>

  <g font-size="12">
    <rect x="236" y="140" width="185" height="100" rx="8" fill="#1a1a26" stroke="#18ffff66"/>
    <text x="248" y="162" fill="#18ffff" font-size="11" font-weight="700">ISOLATED VFS / AGENT</text>
    <text x="248" y="182" fill="#e4e4ef">per-agent filesystem,</text>
    <text x="248" y="198" fill="#e4e4ef">enforced isolation,</text>
    <text x="248" y="214" fill="#e4e4ef">versioned files</text>

    <rect x="431" y="140" width="185" height="100" rx="8" fill="#1a1a26" stroke="#fd79a866"/>
    <text x="443" y="162" fill="#fd79a8" font-size="11" font-weight="700">APPEND-ONLY JOURNAL</text>
    <text x="443" y="182" fill="#e4e4ef">events + tool calls,</text>
    <text x="443" y="198" fill="#e4e4ef">tokens &amp; cost per call,</text>
    <text x="443" y="214" fill="#e4e4ef">LogAct intent/vote/decide</text>

    <rect x="236" y="256" width="185" height="100" rx="8" fill="#1a1a26" stroke="#00e67666"/>
    <text x="248" y="278" fill="#00e676" font-size="11" font-weight="700">CHECKPOINTS</text>
    <text x="248" y="298" fill="#e4e4ef">snapshot / restore / diff,</text>
    <text x="248" y="314" fill="#e4e4ef">byte-exact time travel</text>

    <rect x="431" y="256" width="185" height="100" rx="8" fill="#1a1a26" stroke="#ffd16666"/>
    <text x="443" y="278" fill="#ffd166" font-size="11" font-weight="700">CONTENT-ADDRESSED BLOBS</text>
    <text x="443" y="298" fill="#e4e4ef">sha-256 dedup, zstd,</text>
    <text x="443" y="314" fill="#e4e4ef">+ FTS5 memory &amp; skills</text>
  </g>

  <!-- outputs -->
  <g stroke="#6b6b80" stroke-width="1.4" marker-end="url(#fr-arr)">
    <line x1="636" y1="150" x2="692" y2="150"/>
    <line x1="636" y1="236" x2="692" y2="236"/>
    <line x1="636" y1="322" x2="692" y2="322"/>
  </g>
  <g font-size="12">
    <rect x="696" y="126" width="184" height="48" rx="8" fill="#1a1a26" stroke="#ffffff22"/>
    <text x="708" y="146" fill="#e4e4ef">“what did the agent do?”</text>
    <text x="708" y="163" fill="#9494a8" font-family="Consolas,monospace" font-size="11">= plain SQL, any client</text>

    <rect x="696" y="212" width="184" height="48" rx="8" fill="#1a1a26" stroke="#ffffff22"/>
    <text x="708" y="232" fill="#e4e4ef">forensic snapshot</text>
    <text x="708" y="249" fill="#9494a8" font-family="Consolas,monospace" font-size="11">= copy one file</text>

    <rect x="696" y="298" width="184" height="48" rx="8" fill="#1a1a26" stroke="#ffffff22"/>
    <text x="708" y="318" fill="#e4e4ef">roll back a bad run</text>
    <text x="708" y="335" fill="#9494a8" font-family="Consolas,monospace" font-size="11">= kaos restore</text>
  </g>

  <text x="40" y="410" fill="#6b6b80" font-size="11">Local-first: no cloud dependency, no default telemetry. query() is read-only at the SQLite parse layer (authorizer-enforced). Cross-agent search: 9 ms p95 at 10,000 agents (bench in repo).</text>
</svg>
