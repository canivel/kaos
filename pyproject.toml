[project]
name = "kaos-harness"
version = "2.0.0"
description = "KAOS — Kernel for Agent Orchestration & Sandboxing. Isolated, auditable, portable agent runtimes backed by SQLite."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Danilo Canivel" },
]
requires-python = ">=3.11"
# Base install = the small clean version: flight recorder (VFS, checkpoints,
# events, blobs) + brain (memory, skills, shared log) + the CLI around them.
# Everything heavier lives behind an extra — see [project.optional-dependencies].
dependencies = [
    "click>=8.1",
    "ulid-py>=1.1",
    "zstandard>=0.22",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# feature extras (v2.0) — `kaos <cmd>` tells you which extra it needs
mcp = [
    # mcp 2.x removed the low-level Server.list_tools()/call_tool() decorator
    # API this server is written against; caught by the v2.0 clean-install test
    "mcp>=1.0,<2",
]
router = [
    "httpx>=0.27",
]
ui = [
    "textual>=0.50",
    # web dashboard (kaos ui / kaos demo) — previously undeclared, worked only
    # via mcp's transitive deps; caught by the v2.0 clean-install test
    "starlette>=0.37",
    "uvicorn>=0.29",
]
eval = [
    # the falsifiable-probe harness is pure stdlib today; the extra exists so
    # the surface is named and its future deps have a home
]
all = [
    "kaos-harness[mcp,router,ui,eval]",
]
# tooling extras
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "kaos-harness[all]",
]
fuse = [
    "fusepy>=3.0",
]
benchmarks = [
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://canivel.github.io/kaos/"
Repository = "https://github.com/canivel/kaos"
Changelog = "https://github.com/canivel/kaos/blob/main/CHANGELOG.md"

[project.scripts]
kaos = "kaos.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kaos"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
